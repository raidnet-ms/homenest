# Feature opzionale: Monitoring e diagnostica
# 
# Fornisce:
#   - Sensori di sistema (uptime, WiFi signal)
#   - Info di rete (IP, SSID)
#   - Versione ESPHome
#   - Utility buttons (restart, safe mode)
#
# Substitutions opzionali:
#   disable_entities: 'true/false' - Disabilita entità di default (default: false)


#binary_sensor:
#  - platform: status
#    name: "Connection status"
#    id: connection_status
#    entity_category: diagnostic

text_sensor:
# //todo  - <<: !include wifi_signal_bars.yaml  # creare sensore copy invece che text
text_sensor:
  - platform: wifi_info
    # Info essenziali (sempre utili)
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      disabled_by_default: ${disable_entities}
    
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
      disabled_by_default: ${disable_entities}
    
    # Info avanzate (solo per troubleshooting)
    bssid:
      name: "Connected BSSID"
      entity_category: diagnostic
      disabled_by_default: true  # Sempre nascosto di default
    
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
      disabled_by_default: true  # Sempre nascosto (non cambia mai)
    
    scan_results:
      name: "WiFi Scan Results"
      entity_category: diagnostic
      disabled_by_default: true  # Pesante, solo per debug

button:
  - platform: restart
    name: "Riavvia"
    entity_category: diagnostic
  - platform: shutdown
    name: "Spegni"
    disabled_by_default: $disable_entities
    entity_category: diagnostic
  - platform: safe_mode
    name: "Riavvia in Safe Mode"
    entity_category: diagnostic
    disabled_by_default: $disable_entities

sensor:
  - <<: !include wifi_signal_percent.yaml
  - platform: wifi_signal
    name: "Wifi Signal"
    filters:
      - filter_out: 85.0 # taken from esphome filters example for wifi
      - quantile: # from esphome docs
          window_size: 7
          send_every: 4
          send_first_at: 3
          quantile: .9
    id: wifi_signal_db
    entity_category: diagnostic

  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    entity_category: diagnostic
    disabled_by_default: $disable_entities